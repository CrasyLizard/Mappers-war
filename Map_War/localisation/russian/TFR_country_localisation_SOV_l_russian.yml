l_russian:
 #Events
 sov.1.t: "Возвращение в Кремль"
 sov.1.d: "Наро-Фоминские танковые полки рассекали по брусчатке Красной площади, ополченцы высыпали на площадь, вскоре из БМП показался и сам Ящер. Верные подразделения начали заходить на территорию Кремля через Спасскую башню. Основная же колонна продолжила свой путь к зданию Верховного совета. Кремль оказался полностью оставлен мятежниками, они не решились тревожить древний центр города и отошли к Москва-сити и Останкинской телебашне. Ящер входил в опустевший Геогриевский зал Кремлёвского дворца. В голове крутился лишь один вопрос: "Как мы могли это допустить?" Командир ополчения подошел к Ящеру:\n- Здесь все чисто, все проверили, что дальше, батька?\n- Закрепитесь в центре Москвы. Вероятно путчисты попытаются вернуться и выбить нас со свежими силами. Забарикадируйте мосты, готовьте засады. Наш бой еще не окончен.\n- Как скажете."
 sov.1.a: "Как мы могли это допустить?"
 
 
 
 #Starting Tree (First 2 Years) Начальные Фокусы
 SOV_darkest_hour: "Тёмный час для нашей Родины"
 SOV_darkest_hour_desc: "Грянувшая в феврале революция изменил облик Панмапперии навсегда. Если быть точным, то Панмапперии больше нет. Остались лишь мы единственные, кто способны вернуть нашу Родину из тьмы. В этом нам не помешают не северные капиталисты, ни южные предатели-УСДшники, угнетающие наш народ. Этот путь не будет простым. Но мы должны его выдержать ради нашего будущего."
 SOV_purge: "Зачистить чиновников"
 SOV_purge_desc: "Революция показала истинное лицо многих наших чиновников. Именно их действия позволили этому случится. Стоит немедленно зачистить госапарат от этих "ценных кадров". Они предали рабочий класс, а значит и всю Панмапперию. Таким людям в нашей системе не место. КГБ, к счастью все еще за нас."


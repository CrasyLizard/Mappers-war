 SOV_berkut_rebirth: "Возрождение "Беркута""
 SOV_berkut_rebirth_desc: ""Беркут" был расформирован Киевской хунтой в 2014 году, потому что они боролись за людей и за их права, которые были отняты бандеровцами в Украине. Теперь народное правительство вернулось, и мы можем снова создать "Беркут"."

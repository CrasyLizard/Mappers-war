 russiaflavor.111.t: "Летний дождь"
 russiaflavor.111.d: "Сенатская площадь - одно из самых красивых мест в Санкт-Петербурге. Именно так подумал Денис, когда вновь посетил это место, впервые за несколько лет. После начала кровавой европейской войны он иммигрировал в соседнюю Финляндию, чтобы избежать мобилизации и ужасов войны. После ее окончания к власти пришел сумасшедший тиран Алиханов, который начал процесс превращения Российской Федерации в фашистскую диктатуру, ничем не отличающуюся от режимов Муссолини или Гитлера.\n\nНо совсем недавно, всего пару месяцев назад, все резко поменялось на 180 градусов. Несколько смелых политиков, бравых генералов и, конечно же, Алексей Навальный решили перестать терпеть тоталитарный режим и выступить против него под флагом демократии. Их авантюра закончилась успехом, благодаря чему бешеное животное Алиханов был вынужден бежать, а в стране восстановился демократический, а главное - свободный режим.\n\nПока Денис вспоминал события недавних дней, он дошел до Медного всадника. Памятник Петру Великому величественно стоял почти в середине парка, грозно, но справедливо осматривая проходящих рядом людей. Это был памятник великому реформатору, который поднял страну с колен и модернизировал ее до состояния великой и народной страны. По памятнику медленно стекали капли дождя, одна за другой падая на землю. Смотря на него, Денис невольно улыбнулся, глубоко вздохнул, набирая воздух грудью, и, выдыхая, посмотрел на большую реку Неву, которая текла позади него. Факел свободы вновь загорелся над Россией..."
 russiaflavor.111.a: "...и то, что сгорело дотла, восстанет в нем!"
 
 russiaflavor.112.t: "Зачисление"
 russiaflavor.112.d: "Анастасии было уже за 70, конец ее жизни наступит совсем скоро. Она пережила и Хрущева, и Брежнева, и перестройку, и лихие 90-е, и Путина, и Медведева, и даже Алиханова. И вот, очередное правительство сменилось, и к власти пришли коммунисты во главе с Сергеем Маленковичем. Анастасия равнодушно отнеслась к этому - последние лет 50 она жила на границе с нищетой, и вряд ли что-то могло измениться в ее жизни.\n\nНа днях правительство утвердило реформы социального обеспечения, включая и увеличение пенсионных выплат. Старая бабушка уже давно не верила этим словам. Путинские времена давно научили ее, что такие "реформы" приносят лишь обесценивание и так маленькой пенсии, или увеличение на незначительные пару сотен рублей, что никак ей не помогут.\n\nВ один прекрасный день пожилая женщина услышала слабый звонок, исходящий из ее корейского телефона, подаренного ее сыном на день рождения пару лет назад. Она надела очки и, медленно подойдя к телефону, взяла его, небрежно открыв высветившееся уведомление от банка. "Видимо, пенсия пришла", -  подумала она.\n\nМысли Анастасии оправдались, однако она абсолютно не ожидала того, что она там увидит. Вместо обычной пенсии в размере 25 847 рублей, она увидела целых 51 751 рублей, что было в два раза больше обычного. Женщина обомлела, не веря своим глазам. Спустя несколько мгновений ее лицо тут же расплылось в улыбке, а сама она шокировано села на старый советский диван."
 russiaflavor.112.a: "Это... это был не обман?"
 
 russiaflavor.113.t: "У меня получилось?"
 russiaflavor.113.d: "- Ну давай же, давай...\nИгорь сидел за компьютером и уже в течение часа судорожно обновлял страницу, где должны были появиться результаты экзамена. Периодически, примерно раз в двадцать минут в комнату заходила мать и говорила:\n\n- Игорёк, может, всё-таки выйдешь на улицу, проветришься, воздухом подышишь?\nВ ответ парень только устало вздыхал и продолжал ждать у монитора.\n\nИгорь понимал: тот экзамен, который он писал неделю назад, даже близко не стоял с тем, что сдавала его старшая сестра. Сложность уменьшили, темы пересмотрели, систему распределения баллов изменили. Это, безусловно, придавало уверенности, но то особое волнение перед оглашением результатов, знакомое всем поколениям школьников, никуда не исчезло.\nПрошло ещё около двадцати минут, и наконец прочерк в графе «Результат» сменился числом: 91.\nПарень почувствовал облегчение - любой балл выше восьмидесяти гарантировал ему поступление в тот вуз, о котором он мечтал. Стоявшая сзади мать улыбнулась:\n\n- Ну вот, а ты весь изнервничался. Иди есть, ты с утра голодный.\n\nИгорь откинул голову на спинку кресла и замер так с минуту, глядя в потолок. Этот этап жизни пройден. И пройден успешно. Тяжелый груз тревоги, давивший на плечи весь месяц, наконец исчез, уступив место легкой, пьянящей пустоте.\nВ этот же момент тысячи вчерашних школьников по всей стране имели такую же мысль в голове."
 russiaflavor.113.a: "Да мам, иду."
 
 russiaflavor.114.t: "Переоткрытие Ельцин Центра!"
 russiaflavor.114.d: "После начала проведения масштабных демократических реформ партией Корнилова несколько екатеринбургских активистов предложили правительству интересную идею: отреставрировать и заново открыть закрытый ранее Ельцин-центр.\n\nМногие политики, конечно, скептически отнеслись к данной идее, однако когда новость дошла до верхушки власти, президент России Дмитрий Корнилов лично поручил правительству Екатеринбурга восстановить музей. Спустя буквально несколько недель руководство города выполнило просьбу президента, вновь открыв двери здания гражданам России. Помимо реставрации старых залов музея, а также замены некоторых экспонатов, был добавлен новый зал, посвященный исключительно борьбе с Алихановым и победе демократических сил.\n\nВ день открытия на площади перед центром выступал лично президент, рассказывая о важности не только Ельцина в истории России, но и демократии в целом. В первый же час в музей ринулось пару тысяч человек, образовывая огромные очереди, и еще несколько дней музей сохранял такой большой поток людей. Все сувениры регулярно выкупались за несколько часов работы, а руководство здания заработало целое состояние всего за пару дней открытия."
 russiaflavor.114.a: "Надеюсь, значки с Толстым Ельциным еще остались."
 
 russiaflavor.115.t: "Торжественное открытие памятника Путину и Медведеву"
 russiaflavor.115.d: "Сегодня, воскресным днем, прямо в центре Москвы собралась огромная толпа москвичей и туристов. У станции метро "Театральная" началось столпотворение людей, а на Красной площади находилось значительное присутствие вооруженной охраны. Перед многолюдной толпой находилась хорошо сооруженная трибуна, сзади которой виднелся Собор Василия Блаженного и памятник Минину и Пожарскому. На самой трибуне стоял никто иной, как президент Российской Федерации - Дмитрий Калашников. Рядом с ним было гигантское сооружение, представляющее из себя две исполинские фигуры - Дмитрия Медведева и Владимира Путина.\n\nПроверив микрофон пальцем, а также убедившись, что динамики работают, Калашников уверенно заговорил:\n\n"Уважаемые друзья! Сегодня мы собрались здесь, чтобы почтить две величайшие фигуры в российской политике, и я не мог не приехать лично, чтобы запечатлеть этот великий момент вместе с вами. Ведь именно благодаря этим двум людям мы с вами стоим здесь, живя в сильной и независимой стране, что способна защититься не только от внешних врагов, но и от внутренних. Господин Владимир Владимирович Путин сформировал всю современную Россию, провел необходимые реформы и яро сопротивлялся коллективному западу. Дмитрий Анатольевич Медведев сумел сокрушить силы бандеровцев и НАТО, а также закрепить демократическую систему России, что впоследствии помогла свергнуть фанатика-людоеда Алиханова. Мы должны гордиться такими великими людьми в нашей истории, и поэтому было просто необходимо признать заслуги этих, поистине, величайших лидеров, и закрепить их. Слава России!"\n\nПублика тут же разразилась аплодисментами и радостными криками, а из динамиков стал играть гимн России. Аккуратная оградительная лента была срезана, и памятник был официально открыт."
 russiaflavor.115.a: "Невероятное событие..."
 
 russiaflavor.116.t: "Стажер"
 russiaflavor.116.d: "С одной стороны, лейтенант Михаил Решетин ожидал подобного - правительство недавно одобрило законопроект о расширении финансирования МВД. На днях как раз зарплату повысили, причём неплохо. Михаил уже прикинул, что в следующем месяце сможет позволить себе обновить фотоаппарат: в свободное время он любил заниматься съёмкой природы, птиц, зверей и всего такого. С другой стороны, на работе в последние дни было подозрительно тихо, будто неизбежно надвигалась какая-то неприятность.\n\nВ каком-то смысле так и произошло - сегодня ему в участок прислали стажёра на практику. Вроде бы обычное дело, но был он, как бы сказали раньше, непутевым. Подходит первым делом к Михаилу и говорит:\n\n- Товарищ лейтенант, курсант Рунин в ваше распоряжение прибыл!\n\nРешетин ему всё объяснил: где что лежит, что делать, куда обращаться. Стажёр понимающе кивнул, утвердительно ответил, развернулся, сделал шаг и... поскользнувшись на замерзшей луже, улетел в сугроб.\nМихаил не смог сдержать лёгкую улыбку, но подняться новому подчиненному помог.\n\n- Ну что же вы, товарищ курсант, под ноги не смотрите? Между прочим, полезная привычка в нашем деле.\n\nСтажёр растерянно кивнул и, отряхивая снег с шинели, поспешил в участок - заполнять положенные документы. Лейтенант, глядя ему вслед, пробормотал:\n- Что ж, надеюсь, по крайней мере, будет весело.\n\n"Хотя веселье весельем, а работы то теперь прибавится", - подумал Михаил, доставая сигарету. Он закурил, провожая взглядом неловкую фигуру стажера, и поймал себя на мысли, что этот пацан в сугробе чем-то напомнил ему его самого лет десять назад. Тогда он точно так же волновался в первый день и точно так же мечтал скорее стать офицером."
 russiaflavor.116.a: "Всё будет хорошо."
 
 russiaflavor.117.t: "Помилование"
 russiaflavor.117.d: "Ярослав Стеблёв находился в тюрьме строгого режима уже несколько месяцев. Однако, по ощущениям, окончание его двенадцатилетнего срока не приблизилось ни на мизерную долю. Он отбывал наказание по статье о политическом экстремизме - был одним из первых, кто вступил в Алихановский СЗНД после преобразования Державной России. Тогда он искренне верил, что Алиханов сделает страну по-настоящему великой и гордой. После успешного восстания Журавлева он и остальные члены СЗНД были арестованы, а затем приговорены к длительным тюремным срокам.\n\nДни тянулись медленно и однообразно: Ярослав не мог занять себя ничем, кроме чтения. Он уже почти смирился со своей участью, когда в один из дней к нему пришёл "посетитель".\n\nЛязг замка, скрип открывающейся двери - и затем спокойный голос:\n- Господин Стеблёв, полагаю, у нас есть некоторые темы, которые мы могли бы обсудить.\n\nЯрослав насторожился.\n\n- Вы, наверное, знаете, что президент Белов готовит страну к неизбежной угрозе марксизма-глобализма, исходящего из Европы. И для того чтобы вернуть России былую силу, он ищет умных и опытных людей. Таких, как вы.\n\nЗаключённый недоверчиво спросил:\n- Что вы от меня хотите?\n\nГость невозмутимо ответил:\n- Вы можете проявить лояльность и помочь партии президента защитить Отечество от исходящей угрозы. А взамен Белов великодушно снимет с вас все обвинения.\n\nГлаза Ярослава вспыхнули.\n- Не вопрос,конечно же я согласен помочь своей стране в трудную минуту. Согласен.\n\nПосетитель удовлетворённо улыбнулся и, не проронив больше ни слова, развернулся к выходу. Лязгнула дверь, щёлкнул замок, и камера вновь погрузилась в тишину. Ярослав медленно опустился на нары и уставился в серую стену. Что-то внутри говорило, что просто так он не отделается, но он не хотел об этом думать."
 russiaflavor.117.a: "Луч света, тянувшийся из маленького окошка, потух."
 
 russiaflavor.118.t: "Дар"
 russiaflavor.118.d: "Солнце уже садилось. На улицах зажглись фонари, движение на дорогах замедлилось из-за нескончаемого потока машин.\nУставший Алексей ехал в метро с работы домой. Но сегодня его маршрут делал крюк через центр - а именно через ювелирный магазин. Раньше мысль о том, что он мог бы спонтанно порадовать жену дорогим подарком, даже не пришла бы ему в голову. Однако сейчас он понимал: внезапно это стало ему по карману. В последние пару месяцев его семья в целом стала лучше есть, одеваться и… перестала судорожно проверять банковский счёт, прикидывая, сколько осталось до следующей зарплаты.\nВ магазине Алексей, пройдя вдоль нескольких витрин, остановился у одной - его взгляд зацепило серебряное кольцо с золотыми узорами-вставками. Он подумал, что такой узор должен понравиться Рите, его жене.\n- Извините, пожалуйста...\nКонсультант подошёл к нему и спросил:\n- Здравствуйте, хотите что-то приобрести?\nАлексей ответил:\n- Да, мне нужно вон то кольцо, левее центра.\nПродавец кивнул, ушёл за стойку, достал из ящика ключ, затем подошёл к витрине сзади. "Бряц!" - задняя крышка открылась, продавец достал кольцо и позвал покупателя к кассе.\nКонсультант назвал цену. Алексей задумчиво кивнул.\n"Пилик!" - оплата подтверждена, терминал с характерным звуком напечатал чек.\nПокупатель покинул магазин, вернулся в метро и поехал в сторону дома.\nТам он, переступив порог, произнёс:\n- Моя Рита... я подумал, что тебе это понравится.\nИ достал из кармана футляр.\nВ первые несколько секунд девушка, замерев, стояла, пытаясь понять, что это значит.\nА после, чуть ли не прыгнув, упала в объятия мужа."
 russiaflavor.118.a: "Она действительно это заслужила."
 

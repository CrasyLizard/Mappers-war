 SOV_devastated_industry_idea: "Разрушенная Промышленность"
 SOV_devastated_industry_idea_desc: "Наша промышленность была полностью разрушена войной. Мастерские и заводы, которые когда-то были основой нашей экономики, стали лишь тенью того, чем они были раньше, и их восстановление будет медленным и болезненным. Пока мы пытаемся оправиться от крупнейшей сухопутной войны со времен Второй мировой войны, нам предстоит преодолеть путь, который потребует времени, ресурсов и стойкости."

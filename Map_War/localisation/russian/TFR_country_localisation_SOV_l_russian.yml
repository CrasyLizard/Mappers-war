 SOV_logist_crah: "Логистический крах"
 SOV_logist_crah_desc: "Развал Панмапперии повлек за собой существенные проблемы в связи между городами, многие дороги в свежеобразованных республиках даже не связаны между собой. Некоторые регионы даже самых злейших врагов просто вынуждены получать поставки от своих противников."
 SOV_army_chaos: "Хаос в армии"
 SOV_army_chaos_desc: "После революции 5 февраля мнения раскололись не только в народе Панмапперии, но и в армии. Множество нелояльных подразделений разбойничают на территории страны или пытаются прорваться к своим идеологическим товарищам.\nИз-за развала Панмапперии пострадал и офицерский корпус, а так же генералитет. Генералитет пострадал даже в первую очередь, ведь некоторые из прошлых генералов объявили свои республики. Офицеры не понимают кому подчинятся и что делать с армией. А где-то и вовсе наблюдается их дефицит."
 SOV_adm_crash_1: "Крах административной системы"
 SOV_adm_crash_1_desc: "Из-за развала Панмапперии прежняя административная система по понятным причинам перестала существовать. В стране существуют нелояльные чиновники, которые норовят мешать вашему режиму на местах. В таком бардаке не просто разобраться.\nЕсли кратко: в ПМ случилась национальная катастрофа. Правительство не знает что делать, повстанцы временно радуются своему ограниченному успеху. А жизнь населения вскоре станет невыносимой, кто-то уже потерял связь с семьей, кто-то разошелся во взглядах. А на части наших земель враги из УСД, которые жестоко подавляют волю народа. Ясно лишь одно, для ПМ это катастрофа. При том куда хуже 90-х."
 SOV_adm_crash_2: "Крах административной системы"
 SOV_adm_crash_2_desc: "Из-за развала Панмапперии прежняя административная система по понятным причинам перестала существовать. В стране существуют нелояльные чиновники, которые норовят мешать вашему режиму на местах. В таком бардаке не просто разобраться.\nЕсли кратко: в ПМ случилась национальная катастрофа. Правительство не знает что делать, повстанцы временно радуются своему ограниченному успеху. А жизнь населения вскоре станет невыносимой, кто-то уже потерял связь с семьей, кто-то разошелся во взглядах. А на части наших земель враги из УСД, которые жестоко подавляют волю народа. Ясно лишь одно, для ПМ это катастрофа. При том куда хуже 90-х."
 

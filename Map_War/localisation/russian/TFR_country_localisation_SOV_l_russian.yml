 SOV_ogas_desc: "\n\n\n\n£GFX_ogas_banner\n\n\n\n\n\nОГАС - революционная система, воплотившая мечту старых кибернетиков в новом СССР. Грандиозный проект, позволивший объединить всю экономику нашей страны в единую информационную сеть, - символ нашего прогресса! Наша мечта стала реальностью, и мы можем уверенно двигаться вперед, зная, что у нас есть все необходимые инструменты для достижения успеха. Народ доволен, бюджет пополняется, а автоматизированный коммунизм кажется все более реальным."
